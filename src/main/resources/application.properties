spring.application.name=e-commerce
spring.config.import=optional:file:.env[.properties]
# shard 1
spring.datasource.shard1.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.shard1.jdbc-url=jdbc:mysql://localhost:3306/commerce?
spring.datasource.shard1.username=${DATABASE_USERNAME}
spring.datasource.shard1.password=${DATABASE_PASSWORD}

# shard2
spring.datasource.shard2.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.shard2.jdbc-url=jdbc:mysql://localhost:3307/commerce?
spring.datasource.shard2.username=${DATABASE_USERNAME}
spring.datasource.shard2.password=${DATABASE_PASSWORD}

#spring jap
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=stock-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Cassandra
spring.cassandra.keyspace-name=commerce
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.schema-action=create_if_not_exists
spring.cassandra.local-datacenter=datacenter1


